<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 544" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">How the parts of Kuc-kuc are connected</title>
<desc id="diagram-desc">Three Cloud Run services, web, voice and engine, talk to each other only through a Pub/Sub topic and Cloud Tasks queues. Voice is the only one that reaches the phone network.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#1d2528"/></marker>
</defs>
<rect x="0.5" y="0.5" width="979" height="543" rx="14" fill="#fffdf9" stroke="#ddd5c8"/>

