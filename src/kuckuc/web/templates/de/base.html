<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Kuc-kuc: ein Klopfen an der Tür, wenn gefährliches Wetter kommt{% endblock %}</title>
  <meta name="description" content="Wenn gefährliches Wetter angekündigt ist, ruft Kuc-kuc ältere Menschen an, die allein leben. Wer nicht abnimmt oder Hilfe braucht, bekommt Besuch von einem Nachbarn.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="/static/app.css?v={{ v }}">
  <link rel="icon" href="/static/door.svg" type="image/svg+xml">
</head>
<body>
  <a class="skip" href="#main">Zum Inhalt</a>
  <header class="site-header">
    <a class="wordmark" href="/de" aria-label="Kuc-kuc, Startseite">
      <svg class="knock" viewBox="0 0 44 32" aria-hidden="true" focusable="false">
        <rect x="2" y="3" width="17" height="26" rx="2"/>
        <circle cx="14.5" cy="17" r="1.4"/>
        <path d="M25 11c2.4 3 2.4 7 0 10M30.5 8c4 5 4 11 0 16M36 5c5.6 7 5.6 15 0 22"/>
      </svg>
      <span>Kuc-kuc</span>
    </a>
    <nav aria-label="Hauptmenü">
      <a href="/de#so">So funktioniert es</a>
      <a href="/de#organisationen">Für Städte</a>
      <a href="/de#kontakt">Kontakt</a>
      <a href="/" lang="en">English</a>
    </nav>
  </header>

  <main id="main">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <p><strong>Kuc-kuc ist kein Notrufdienst.</strong> Im Notfall wählen Sie 112.</p>
    <p>
      Wetterdaten von <a href="https://open-meteo.com/">Open-Meteo.com</a> (CC BY 4.0).
      <a href="/de/impressum">Impressum</a> · <a href="/de/datenschutz">Datenschutz</a>
      {% if github_url %} · <a href="{{ github_url }}">Quellcode auf GitHub</a>{% endif %}
    </p>
  </footer>
</body>
</html>
