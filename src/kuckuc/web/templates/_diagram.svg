{#- The architecture diagram. Parts that are not deployed yet are left out (see `features`).
    Presentation attributes only: the page forbids inline styles. -#}
{%- set forecast = "forecast" in features -%}
{%- set family = "family" in features -%}
{%- set loadtest = "loadtest" in features -%}
{%- set bus_bottom = 426 if forecast else 324 -%}
{%- set height = 544 if loadtest else (464 if forecast else 362) -%}
{%- set ink = "#1d2528" -%}{%- set muted = "#586367" -%}{%- set accent = "#a8432a" -%}
{%- set sans = "system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" -%}
{%- macro box(x, y, w, title, sub, cloud_run=false) -%}
<rect x="{{ x }}" y="{{ y }}" width="{{ w }}" height="56" rx="9" fill="{{ '#ffffff' if cloud_run else '#f7f3ec' }}" stroke="{{ accent if cloud_run else ink }}" stroke-width="{{ 1.8 if cloud_run else 1.1 }}"/>
<text x="{{ x + 14 }}" y="{{ y + 24 }}" font-family="{{ sans }}" font-size="15" font-weight="700" fill="{{ ink }}">{{ title }}</text>
<text x="{{ x + 14 }}" y="{{ y + 42 }}" font-family="{{ sans }}" font-size="11.5" fill="{{ muted }}">{{ sub }}</text>
{%- endmacro -%}
{%- macro label(x, y, text, anchor="middle") -%}
<text x="{{ x }}" y="{{ y }}" font-family="{{ sans }}" font-size="11.5" fill="{{ ink }}" text-anchor="{{ anchor }}">{{ text }}</text>
{%- endmacro -%}
<svg class="diagram" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 {{ height }}" role="img" aria-labelledby="diagram-title diagram-desc">
<title id="diagram-title">How the parts of Kuc-kuc are connected</title>
<desc id="diagram-desc">Three Cloud Run services, web, voice and engine, talk to each other only through a Pub/Sub topic and Cloud Tasks queues. Voice is the only one that reaches the phone network.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="{{ ink }}"/></marker>
</defs>
<rect x="0.5" y="0.5" width="979" height="{{ height - 1 }}" rx="14" fill="#fffdf9" stroke="#ddd5c8"/>

<rect x="262" y="12" width="226" height="{{ height - 20 }}" rx="12" fill="none" stroke="{{ accent }}" stroke-width="1" stroke-dasharray="5 5"/>
<text x="375" y="{{ height - 18 }}" font-family="{{ sans }}" font-size="11.5" fill="{{ accent }}" text-anchor="middle">Cloud Run · every box scales to zero</text>

<line x1="470" y1="176" x2="718" y2="176" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

<rect x="600" y="30" width="28" height="{{ bus_bottom - 30 }}" rx="8" fill="{{ accent }}"/>
<text transform="translate(618 {{ (30 + bus_bottom) // 2 }}) rotate(-90)" font-family="{{ sans }}" font-size="12.5" font-weight="700" fill="#fffaf5" text-anchor="middle">Pub/Sub · topic “events”</text>

{{ box(20, 30, 180, "Browser", "visitor trying the demo") }}
{{ box(20, 140, 180, "Twilio", "phone calls and recordings") }}
{% if family %}{{ box(20, 268, 180, "Telegram", "messages to the family") }}{% endif %}
{% if forecast %}{{ box(20, 370, 180, "Open-Meteo", "weather forecast") }}{% endif %}

{{ box(280, 30, 190, "web", "public · site and demo", true) }}
{{ box(280, 140, 190, "voice", "talks to the phone network", true) }}
<rect x="290" y="218" width="170" height="28" rx="14" fill="#f7f3ec" stroke="{{ ink }}" stroke-width="1.1"/>
{{ label(375, 236, "Cloud Tasks · calls, timers") }}
{{ box(280, 268, 190, "engine", "private · one state machine", true) }}
{% if forecast %}{{ box(280, 370, 190, "forecast-scan", "job · every 3 h, Cloud Scheduler", true) }}{% endif %}
{% if loadtest %}{{ box(280, 450, 190, "loadtest", "job · thousands of simulated calls", true) }}{% endif %}

{{ box(720, 140, 240, "Vertex AI · Text-to-Speech", "Gemini understands, Chirp 3 HD speaks") }}
{{ box(720, 268, 240, "Firestore · Cloud Storage", "state and audio, used by every service") }}

<line x1="200" y1="58" x2="278" y2="58" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(239, 50, "HTTPS") }}
<line x1="200" y1="168" x2="278" y2="168" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
{{ label(239, 160, "calls") }}
{% if family %}<line x1="278" y1="296" x2="202" y2="296" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(240, 288, "notices") }}{% endif %}
{% if forecast %}<line x1="200" y1="398" x2="278" y2="398" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(239, 390, "forecast") }}{% endif %}

<line x1="470" y1="58" x2="598" y2="58" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(534, 50, "check.requested") }}
<line x1="470" y1="156" x2="598" y2="156" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(534, 148, "call.completed") }}
<line x1="598" y1="296" x2="472" y2="296" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(535, 288, "every event, pushed") }}
{% if forecast %}<line x1="470" y1="398" x2="598" y2="398" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(534, 390, "alert.created") }}{% endif %}
{% if loadtest %}<path d="M470 478 H614 V{{ bus_bottom + 2 }}" fill="none" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(540, 470, "check.requested × n") }}{% endif %}

<line x1="375" y1="268" x2="375" y2="248" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
<line x1="375" y1="218" x2="375" y2="198" stroke="{{ ink }}" stroke-width="1.3" marker-end="url(#arrow)"/>
{{ label(673, 168, "audio → JSON") }}
</svg>
